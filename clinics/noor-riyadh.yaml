# =============================================================================
# Clinic knowledge base — عيادات نور الرياض (fictional demo clinic)
#
# THIS FILE IS THE ENTIRE ONBOARDING SURFACE FOR A NEW CLINIC.
# Copy it to clinics/<new-slug>.yaml, change the contents, run
# `npm run kb:validate` and the receptionist is live for that clinic.
# Nothing else needs to change — no code, no migration, no redeploy.
#
# Validate after every edit:  npm run kb:validate
# Schema:                     packages/core/src/kb/schema.ts
# =============================================================================
version: 1

clinic:
  slug: noor-riyadh
  name_ar: "عيادات نور الرياض لطب الأسنان والتجميل"
  name_en: "Noor Riyadh Dental & Aesthetic Clinics"
  tagline_ar: "ابتسامتك وبشرتك بأيدٍ سعودية متخصصة"
  timezone: "Asia/Riyadh"
  # Used by the metrics page: bookings × avg ticket = estimated captured revenue.
  avg_ticket_sar: 1150
  # PDPL retention window (2 years). The purge job deletes patient data past this.
  retention_days: 730

  address:
    ar: "طريق الأمير تركي بن عبدالعزيز الأول، حي الصحافة، الرياض 13315"
    en: "Prince Turki bin Abdulaziz Al Awwal Rd, Al Sahafah District, Riyadh 13315"
    district_ar: "حي الصحافة"
    city_ar: "الرياض"
    map_url: "https://maps.google.com/?q=24.8075,46.6390"
    landmark_ar: "مقابل بوليفارد الصحافة، نفس مبنى صيدلية النهدي، الدور الثاني"
    parking_ar: "مواقف مجانية للمراجعين في قبو المبنى (B1)، والدخول من البوابة الخلفية"

  contact:
    phone: "+966112345678"
    whatsapp: "+966501234567"
    email: "hello@noorriyadh-demo.sa"
    instagram: "@noor.riyadh.clinics"
    website: "https://noorriyadh-demo.sa"

  # 0 = Sunday, 1 = Monday … 6 = Saturday.
  hours:
    - days: [0, 1, 2, 3, 4]      # الأحد – الخميس
      open: "09:00"
      close: "21:00"
      breaks:
        - start: "13:00"
          end: "16:00"
          label_ar: "استراحة الظهر"
    - days: [6]                  # السبت
      open: "12:00"
      close: "21:00"
      breaks: []
    # الجمعة إجازة — no entry means closed.

  holidays:
    - "2026-09-23"   # اليوم الوطني
    - "2027-03-20"   # إجازة عيد الفطر
    - "2027-03-21"
    - "2027-03-22"

  emergency:
    ambulance_number: "997"
    urgent_line: "+966112345600"
    nearest_er_ar: "أقرب طوارئ: مستشفى الملك فهد التخصصي - قسم الطوارئ، طريق الملك عبدالعزيز"

scheduling:
  slot_granularity_min: 15
  min_notice_hours: 2
  max_advance_days: 60
  max_slots_offered: 6

